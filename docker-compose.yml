version: "3.9"

networks:
  app_network:

services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - product_service
      - order_service
    networks:
      - app_network

  auth_service:
    build: ./services/auth_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DB_HOST=postgres
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    networks:
      - app_network

  user_service:
    build: ./services/user_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DB_HOST=postgres
    ports:
      - "8002:8000"
    depends_on:
      - postgres
    networks:
      - app_network

  product_service:
    build: ./services/product_service
    container_name: product_service
    environment:
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app_network
    ports:
      - "8003:8000"   # ✅ ВОТ ЭТОГО НЕ ХВАТАЛО
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  order_service:
    build: ./services/order_service
    environment:
      - DB_HOST=wrong_host   # ❌ ИНЦИДЕНТ (оставь так для отчета)
    depends_on:
      - postgres
    networks:
      - app_network

  chat_service:
    build: ./services/chat_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8005:8000"
    networks:
      - app_network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=0.0.0.0:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    network_mode: "host"