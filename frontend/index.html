<!DOCTYPE html>
<html>
<head>
    <title>Microservices App</title>
    <link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: #0f172a;
    color: #e5e7eb;
}

.layout {
    display: flex;
    height: 100vh;
}

.left {
    width: 320px;
    background: #0b1220;
    border-right: 1px solid #1f2937;
    padding: 15px;
    overflow-y: auto;
}

.right {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

h1 {
    margin: 0;
    padding: 15px;
    text-align: center;
    background: #111827;
    border-bottom: 1px solid #1f2937;
}

h2 {
    margin: 10px 0;
}

input {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #2563eb;
}

nav {
    margin-bottom: 15px;
}

#products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
}

#products div {
    background: #1e293b;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #334155;
}

pre {
    background: #0b1220;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1f2937;
    color: #10b981;
}

#productCard {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #111827;
    padding: 20px;
    border-radius: 12px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border: 1px solid #334155;
    z-index: 999;
}
</style>

</head>

<body>

<h1>Microservices System</h1>

<div class="layout">

    <div class="left">

        <h2>Register</h2>
        <input id="reg_email" placeholder="email">
        <input id="reg_password" placeholder="password">
        <button onclick="register()">Register</button>

        <h2>Login</h2>
        <input id="login_email" placeholder="email">
        <input id="login_password" placeholder="password">
        <button onclick="login()">Login</button>

        <hr>

        <h2>Profile</h2>

        <input id="edit_email" placeholder="new email">
        <input id="edit_password" placeholder="new password">

        <button onclick="updateProfile()">Update</button>
        <button onclick="deleteProfile()">Delete</button>
        <button onclick="getProfile()">Get</button>
        <button onclick="logout()">Logout</button>

        <pre id="output"></pre>

    </div>

    <div class="right">


        <div id="storePanel">

            <h2>Create Product</h2>

            <input id="p_name" placeholder="name">
            <input id="p_desc" placeholder="description">
            <input id="p_price" placeholder="price">

            <button onclick="createProduct()">Create Product</button>

            <h2>Products</h2>
            <div id="products"></div>

        </div>

    </div>

</div>

<div id="productCard" style="display:none;">
    <h2 id="card_title"></h2>
    <p id="card_desc"></p>
    <p id="card_price"></p>

    <h3>Comments</h3>
    <div id="comments"></div>

    <input id="comment_text" placeholder="write comment">
    
    <button onclick="sendComment()">Send</button>

    <button onclick="closeCard()">Close</button>

    <button onclick="buyProduct()" style="background: #10b981;">Buy Now</button>
</div>

<script>

let token = localStorage.getItem("token");

async function register() {
    try {
        const res = await fetch("http://localhost:8001/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("reg_email").value,
                password: document.getElementById("reg_password").value
            })
        });

        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerText =
                "ERROR: " + JSON.stringify(data);
            return;
        }

        document.getElementById("output").innerText =
            "REGISTERED: " + JSON.stringify(data);

    } catch (err) {
        document.getElementById("output").innerText =
            "NETWORK ERROR: " + err;
    }
}

function openStore() {
    document.getElementById("storePanel").style.display = "block";
}

async function createProduct() {
    try {
        const res = await fetch("http://localhost:8003/products", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name: document.getElementById("p_name").value,
                description: document.getElementById("p_desc").value,
                price: Number(document.getElementById("p_price").value)
            })
        });

        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerText =
                "CREATE ERROR: " + JSON.stringify(data);
            return;
        }

        document.getElementById("output").innerText =
            "PRODUCT CREATED ✅";

        loadProducts(); 

    } catch (err) {
        document.getElementById("output").innerText =
            "NETWORK ERROR: " + err;
    }
}


async function loadProducts() {
    try {
        const res = await fetch("http://localhost:8003/products");
        const data = await res.json();

        const container = document.getElementById("products");
        container.innerHTML = "";

        data.forEach(p => {
            const div = document.createElement("div");
            div.innerHTML = `
                <b>${p.name}</b> - $${p.price ?? 0}
                <button onclick="openProduct(${p.id})">View</button>
            `;
            container.appendChild(div);
        });

    } catch (err) {
        document.getElementById("output").innerText =
            "LOAD ERROR: " + err;
    }
}
let currentProductId = null;

async function openProduct(id) {
    currentProductId = id;

    const res = await fetch("http://localhost:8003/products/" + id);
    const p = await res.json();

    document.getElementById("card_title").innerText = p.name;
    document.getElementById("card_desc").innerText = p.description;
    document.getElementById("card_price").innerText = "$" + p.price;

    document.getElementById("productCard").style.display = "block";

    loadComments();
}


async function sendComment() {
    try {
        const res = await fetch("http://localhost:8005/comment", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                product_id: currentProductId,
                user: "user",
                text: document.getElementById("comment_text").value
            })
        });

        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerText =
                "COMMENT ERROR: " + JSON.stringify(data);
            return;
        }

        document.getElementById("comment_text").value = "";
        loadComments();

    } catch (err) {
        document.getElementById("output").innerText =
            "NETWORK ERROR: " + err;
    }
}


async function loadComments() {
    const res = await fetch(
        "http://localhost:8005/comment/" + currentProductId
    );

    const data = await res.json();

    const box = document.getElementById("comments");
    box.innerHTML = "";

    data.forEach(c => {
        const div = document.createElement("div");
        div.innerText = c.user + ": " + c.text;
        box.appendChild(div);
    });
}


function closeCard() {
    document.getElementById("productCard").style.display = "none";
}

async function buyProduct() {
    const userEmail = document.getElementById("edit_email").value || "guest@example.com";
    
    const productName = document.getElementById("card_title").innerText;
    const productPrice = parseFloat(document.getElementById("card_price").innerText.replace('$', ''));

    try {
        const res = await fetch("http://localhost:8004/orders", { 
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                product_id: currentProductId,
                product_name: productName,
                price: productPrice,
                user_email: userEmail
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert("Order failed: " + JSON.stringify(data));
            return;
        }

        alert("Order placed successfully! ✅");
        console.log("Order Data:", data);

    } catch (err) {
        alert("Network Error: " + err);
    }
}

async function login() {
    try {
        const res = await fetch("http://localhost:8001/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("login_email").value,
                password: document.getElementById("login_password").value
            })
        });

        const data = await res.json();

        if (!res.ok || !data.access_token) {
            document.getElementById("output").innerText =
                "LOGIN ERROR: " + JSON.stringify(data);
            return;
        }

        token = data.access_token;
        localStorage.setItem("token", token);

        document.getElementById("output").innerText =
            "LOGGED IN ✅";

    } catch (err) {
        document.getElementById("output").innerText =
            "NETWORK ERROR: " + err;
    }
}
async function getProfile() {
    try {
        const res = await fetch("http://localhost:8002/me", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerText =
                "ERROR: " + JSON.stringify(data);
            return;
        }

        document.getElementById("output").innerText =
            JSON.stringify(data);

    } catch (err) {
        document.getElementById("output").innerText =
            "NETWORK ERROR: " + err;
    }
}

async function updateProfile() {
    try {
        const res = await fetch("http://localhost:8002/me", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                email: document.getElementById("edit_email").value || null,
                password: document.getElementById("edit_password").value || null
            })
        });

        const data = await res.json();

        document.getElementById("output").innerText =
            "UPDATED: " + JSON.stringify(data);

    } catch (err) {
        document.getElementById("output").innerText =
            "ERROR: " + err;
    }
}

async function deleteProfile() {
    try {
        const res = await fetch("http://localhost:8002/me", {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await res.json();

        document.getElementById("output").innerText =
            "DELETED: " + JSON.stringify(data);

        logout();

    } catch (err) {
        document.getElementById("output").innerText =
            "ERROR: " + err;
    }
}

function logout() {
    token = null;
    localStorage.removeItem("token");

    document.getElementById("output").innerText =
        "LOGGED OUT ✅";
}

</script>

</body>
</html>
